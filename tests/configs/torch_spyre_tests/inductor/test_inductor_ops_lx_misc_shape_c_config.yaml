# LX-planning shard: inductor_ops family 'misc_shape_b2', both wrap classes
# (LxPlanningTwoOpPointwiseAdditionTest '(x + x) / 2' and
#  LxPlanningTwoOpReductionTest 'torch.sum(x, dim=0)').
#
# Auto-split of test_inductor_ops_lx_planning.py, mirroring the
# test_inductor_ops.py config sharding. The full (non-truncated) test
# set is enabled in CI via TEST_LX_PLANNING_FULL=1 + TEST_LX_PLANNING_RUN_SKIPS=1
# (see .github/workflows/_test_matrix.yaml). The xfail lists below are
# the source of truth for known LX-planning failures (the in-file .py
# skip-lists were removed as duplicates).
test_suite_config:
  labels: [full]
  files:
    - path: ${TORCH_DEVICE_ROOT}/tests/inductor/test_inductor_ops_lx_planning.py
      unlisted_test_mode: skip
      tests:
        # Known LX-planning failures -- run and expected to fail. Non-strict
        # xfail: an unexpected pass (XPASS) does not fail CI. Entries failing
        # in both wraps collapse to (pointwise|reduction).
        - names:
            # unfold_* LX cases now pass via the reshape/unfold CPU-roundtrip
            # reroute (PR #3001); they fall through to the test_unfold.*
            # mandatory_success block below.
            - LxPlanning.*::test_t_2d_49159x4096_lx_planning_reduction
            - LxPlanning.*::test_t_2d_contiguous_1088x320_lx_planning_reduction
            - LxPlanning.*::test_t_2d_contiguous_4096x49280_lx_planning_reduction
            - LxPlanning.*::test_t_2d_contiguous_49280x4096_lx_planning_reduction
            - LxPlanning.*::test_transpose_2d_large_dim_0_1_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_transpose_2d_large_dim_0_1_nopad_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_transpose_2d_large_dim_0_2_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_transpose_2d_large_dim_0_2_nopad_lx_planning_(pointwise|reduction)
          mode: xfail
        - names:
            - LxPlanning.*::test_unfold.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_squeeze.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_unsqueeze.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_t_1d.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_t_2d.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_transpose_2d.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_transpose_3d.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_transpose_4d.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_transpose_patterns.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_add_constant.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_repeat.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_restickify_fp32_unsupported_xfail.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_restickify_int64_unsupported_xfail.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_multiops_split.*_lx_planning_(pointwise|reduction)
          mode: mandatory_success
          tags:
            - ops__inductor_misc_shape
