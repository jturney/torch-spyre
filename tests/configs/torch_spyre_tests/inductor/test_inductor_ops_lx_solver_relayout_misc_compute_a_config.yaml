# Solver-relayout sweep shard: mirrors test_inductor_ops_lx_misc_compute_a_config.yaml but runs
# tests/inductor/test_inductor_ops_lx_solver_relayout.py, the LX-planning
# wrap re-wrapped with layout_solver=cpsat, co_optimizing_lx_planning=True
# and lx_solver_relayout=True. The xfail floor is inherited from the
# LX-planning shard; deltas found by this sweep are appended per shard.
test_suite_config:
  labels: [regression, trunk]
  files:
    - path: ${TORCH_DEVICE_ROOT}/tests/inductor/test_inductor_ops_lx_solver_relayout.py
      unlisted_test_mode: skip
      tests:
        # Known LX-planning failures -- run and expected to fail. Non-strict
        # xfail: an unexpected pass (XPASS) does not fail CI. Entries failing
        # in both wraps collapse to (pointwise|reduction).
        - names:
            - SolverRelayout.*::test_scalar_cpu_combined_3d_lx_planning_reduction
            - SolverRelayout.*::test_add_alpha_add_alpha_2_67x256_67x256_lx_planning_reduction
            - SolverRelayout.*::test_add_alpha_add_alpha_2_67x71x256_67x71x256_lx_planning_reduction
            - SolverRelayout.*::test_add_alpha_add_alpha_neg_67x71x256_67x71x256_lx_planning_reduction
          mode: xfail
        - names:
            - SolverRelayout.*::test_activation_cls.*_lx_planning_(pointwise|reduction)
            - SolverRelayout.*::test_activation_fn.*_lx_planning_(pointwise|reduction)
            - SolverRelayout.*::test_relu_inplace.*_lx_planning_(pointwise|reduction)
            - SolverRelayout.*::test_add_broadcast.*_lx_planning_(pointwise|reduction)
            - SolverRelayout.*::test_add_alpha.*_lx_planning_(pointwise|reduction)
            - SolverRelayout.*::test_add_scalar.*_lx_planning_(pointwise|reduction)
            - SolverRelayout.*::test_max_sub_broadcast.*_lx_planning_(pointwise|reduction)
            - SolverRelayout.*::test_sub_alpha.*_lx_planning_(pointwise|reduction)
            - SolverRelayout.*::test_sub_broadcast.*_lx_planning_(pointwise|reduction)
            - SolverRelayout.*::test_sub_scalar.*_lx_planning_(pointwise|reduction)
            - SolverRelayout.*::test_scalar_cpu.*_lx_planning_(pointwise|reduction)
          mode: mandatory_success
