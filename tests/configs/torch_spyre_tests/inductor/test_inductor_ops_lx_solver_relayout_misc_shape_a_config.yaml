# Solver-relayout sweep shard: mirrors test_inductor_ops_lx_misc_shape_a_config.yaml but runs
# tests/inductor/test_inductor_ops_lx_solver_relayout.py, the LX-planning
# wrap re-wrapped with layout_solver=cpsat, co_optimizing_lx_planning=True
# and lx_solver_relayout=True. The xfail floor is inherited from the
# LX-planning shard; deltas found by this sweep are appended per shard.
test_suite_config:
  labels: [regression, trunk]
  files:
    - path: ${TORCH_DEVICE_ROOT}/tests/inductor/test_inductor_ops_lx_solver_relayout.py
      unlisted_test_mode: skip
      tests:
        # Known LX-planning failures -- run and expected to fail. Non-strict
        # xfail: an unexpected pass (XPASS) does not fail CI. Entries failing
        # in both wraps collapse to (pointwise|reduction).
        - names:
            - SolverRelayout.*::test_full_value_1_lx_planning_(pointwise|reduction)
          mode: xfail
        - names:
            - SolverRelayout.*::test_split.*_lx_planning_(pointwise|reduction)
            - SolverRelayout.*::test_arange.*_lx_planning_(pointwise|reduction)
            - SolverRelayout.*::test_full.*_lx_planning_(pointwise|reduction)
            - SolverRelayout.*::test_new_ones.*_lx_planning_(pointwise|reduction)
            - SolverRelayout.*::test_numel.*_lx_planning_(pointwise|reduction)
            - SolverRelayout.*::test_ones.*_lx_planning_(pointwise|reduction)
            - SolverRelayout.*::test_zeros.*_lx_planning_(pointwise|reduction)
            - SolverRelayout.*::test_empty_like.*_lx_planning_(pointwise|reduction)
            - SolverRelayout.*::test_clone.*_lx_planning_(pointwise|reduction)
            - SolverRelayout.*::test_copy_roundtrip.*_lx_planning_(pointwise|reduction)
          mode: mandatory_success
          tags:
            - ops__inductor_misc_shape
