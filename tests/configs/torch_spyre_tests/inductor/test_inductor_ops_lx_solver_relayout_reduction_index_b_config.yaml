# Solver-relayout sweep shard: mirrors test_inductor_ops_lx_reduction_index_b_config.yaml but runs
# tests/inductor/test_inductor_ops_lx_solver_relayout.py, the LX-planning
# wrap re-wrapped with layout_solver=cpsat, co_optimizing_lx_planning=True
# and lx_solver_relayout=True. The xfail floor is inherited from the
# LX-planning shard; deltas found by this sweep are appended per shard.
test_suite_config:
  labels: [regression, trunk]
  files:
    - path: ${TORCH_DEVICE_ROOT}/tests/inductor/test_inductor_ops_lx_solver_relayout.py
      unlisted_test_mode: skip
      tests:
        # Known LX-planning failures -- run and expected to fail. Non-strict
        # xfail: an unexpected pass (XPASS) does not fail CI. Entries failing
        # in both wraps collapse to (pointwise|reduction).
        - names:
            - SolverRelayout.*::test_aminmax_keepdim0_aminmax_2d_dim_0_lx_planning_pointwise
            - SolverRelayout.*::test_mean_keepdim1_mean_fp16_2d_dim_1_lx_planning_pointwise
            - SolverRelayout.*::test_mean_keepdim1_mean_fp16_2d_dim_0_lx_planning_(pointwise|reduction)
            - SolverRelayout.*::test_mean_keepdim0_mean_fp16_3d_dim_1_lx_planning_reduction
          mode: xfail
        - names:
            - SolverRelayout.*::test_aminmax_keepdim.*_lx_planning_(pointwise|reduction)
            - SolverRelayout.*::test_sum_keepdim0.*_lx_planning_(pointwise|reduction)
            - SolverRelayout.*::test_sum_keepdim1.*_lx_planning_(pointwise|reduction)
            - SolverRelayout.*::test_mean_keepdim0.*_lx_planning_(pointwise|reduction)
            - SolverRelayout.*::test_mean_keepdim1.*_lx_planning_(pointwise|reduction)
            - SolverRelayout.*::test_vector_norm_keepdim.*_lx_planning_(pointwise|reduction)
            - SolverRelayout.*::test_matrix_norm_keepdim.*_lx_planning_(pointwise|reduction)
            - SolverRelayout.*::test_linalg_norm_keepdim.*_lx_planning_(pointwise|reduction)
            - SolverRelayout.*::test_argmin_keepdim0.*_lx_planning_(pointwise|reduction)
            - SolverRelayout.*::test_min_tuple_output_keepdim0.*_lx_planning_(pointwise|reduction)
            - SolverRelayout.*::test_logsumexp_keepdim0_known_xfail.*_lx_planning_(pointwise|reduction)
            - SolverRelayout.*::test_mean_3d_dim0_keepdim.*_lx_planning_(pointwise|reduction)
            - SolverRelayout.*::test_index_copy_.*_lx_planning_(pointwise|reduction)
            # Regression guard for LX producer/consumer core->slice agreement
            # (#3374, #3387). Asserts both values and that the buffer stays in LX.
            - SolverRelayout.*::test_shared_input_two_reductions.*_lx_planning_(pointwise|reduction)
          mode: mandatory_success
