# Solver-relayout sweep shard: mirrors test_inductor_ops_lx_pointwise_config.yaml but runs
# tests/inductor/test_inductor_ops_lx_solver_relayout.py, the LX-planning
# wrap re-wrapped with layout_solver=cpsat, co_optimizing_lx_planning=True
# and lx_solver_relayout=True. The xfail floor is inherited from the
# LX-planning shard; deltas found by this sweep are appended per shard.
test_suite_config:
  labels: [regression, trunk]
  files:
    - path: ${TORCH_DEVICE_ROOT}/tests/inductor/test_inductor_ops_lx_solver_relayout.py
      unlisted_test_mode: skip
      tests:
        # Known LX-planning failures -- run and expected to fail. Non-strict
        # xfail: an unexpected pass (XPASS) does not fail CI. Entries failing
        # in both wraps collapse to (pointwise|reduction).
        - names:
            - SolverRelayout.*::test_alias_operands_cube_67x256_lx_planning_reduction
            - SolverRelayout.*::test_alias_operands_cube_67x71x256_lx_planning_reduction
            - SolverRelayout.*::test_alias_operands_double_67x71x256_lx_planning_reduction
            - SolverRelayout.*::test_alias_operands_triple_67x256_lx_planning_reduction
            - SolverRelayout.*::test_alias_operands_triple_67x71x256_lx_planning_reduction
            - SolverRelayout.*::test_pointwise_binary_op_div_67x256_67x256_lx_planning_reduction
            - SolverRelayout.*::test_pointwise_binary_op_div_67x71x256_67x71x256_lx_planning_reduction
            - SolverRelayout.*::test_pointwise_range_op_clamp_fp16_lx_planning_reduction
            - SolverRelayout.*::test_pointwise_unary_op_reciprocal_67x71x256_lx_planning_reduction
            - SolverRelayout.*::test_pointwise_binary_op_add_67x71x256_67x71x256_lx_planning_reduction
            - SolverRelayout.*::test_pointwise_binary_op_sub_67x71x256_67x71x256_lx_planning_reduction
          mode: xfail
        - names:
            - SolverRelayout.*::test_(pointwise|sqrt|rsqrt|log_|alias_operands|cmp|logical_not|bool|eq_scalar|scalar_(comparison|multidim|vs_tensor)_base|scalar_comparison_simple1|eq_scalar_constant_int).*_lx_planning_(pointwise|reduction)
            - SolverRelayout.*::test_binary_op_stick_crossing_last_dim_lx_planning_(pointwise|reduction)
          mode: mandatory_success
          tags:
            - ops__inductor-pointwise
