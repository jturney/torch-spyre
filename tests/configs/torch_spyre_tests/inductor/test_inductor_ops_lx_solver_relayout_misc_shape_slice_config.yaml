# Solver-relayout sweep shard: mirrors test_inductor_ops_lx_misc_shape_slice_config.yaml but runs
# tests/inductor/test_inductor_ops_lx_solver_relayout.py, the LX-planning
# wrap re-wrapped with layout_solver=cpsat, co_optimizing_lx_planning=True
# and lx_solver_relayout=True. The xfail floor is inherited from the
# LX-planning shard; deltas found by this sweep are appended per shard.
test_suite_config:
  labels: [regression, trunk]
  files:
    - path: ${TORCH_DEVICE_ROOT}/tests/inductor/test_inductor_ops_lx_solver_relayout.py
      unlisted_test_mode: skip
      tests:
        # Known LX-planning failures -- run and expected to fail. Non-strict
        # xfail: an unexpected pass (XPASS) does not fail CI. Entries failing
        # in both wraps collapse to (pointwise|reduction).
        - names:
            - SolverRelayout.*::test_slice_stick_reduce_dim2_sum_3d64_0_lx_planning_(pointwise|reduction)
            - SolverRelayout.*::test_slice_stick_reduce_dim2_amax_3d64_0_lx_planning_pointwise
            - SolverRelayout.*::test_slice_stick_clone_3d128_01_lx_planning_reduction
            - SolverRelayout.*::test_slice_stick_clone_3d64_01_lx_planning_reduction
            - SolverRelayout.*::test_slice_stick_reduce_dim2_sum_3d128_01_lx_planning_reduction
            - SolverRelayout.*::test_slice_stick_reduce_dim2_sum_3d64_01_lx_planning_reduction
          mode: xfail
        - names:
            - SolverRelayout.*::test_slice.*_lx_planning_(pointwise|reduction)
          mode: mandatory_success
          tags:
            - ops__inductor_misc_shape
